name: CI

on:
  push:
  pull_request:

jobs:
  # KeyboardShortcuts 3.1.0 (project.yml) declares Swift tools 6.2, so the
  # project needs Xcode 26+; macos-26 ships it as the default. No hosted image
  # can run Xcode 26 on macOS 14, so the minimum OS is covered at compile time
  # (deploymentTarget 14.0 makes unguarded newer-API use a build error) and by
  # a manual check before each release, not by a CI test run.
  test-and-release-check:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project Wisp.xcodeproj
          -scheme Wisp
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: >-
          xcodebuild build
          -project Wisp.xcodeproj
          -scheme Wisp
          -configuration Release
          -arch arm64
          -arch x86_64
          -derivedDataPath "$RUNNER_TEMP/WispDerivedData"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      - name: Verify Release architecture, signature, and entitlements
        run: |
          release_app="$RUNNER_TEMP/WispDerivedData/Build/Products/Release/Wisp.app"
          test -d "$release_app"
          lipo -info "$release_app/Contents/MacOS/Wisp"
          codesign --verify --deep --strict "$release_app"
          codesign -d --entitlements :- "$release_app" > /tmp/wisp-entitlements.plist
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' /tmp/wisp-entitlements.plist 2>/dev/null; then
            echo 'Release unexpectedly contains com.apple.security.get-task-allow' >&2
            exit 1
          fi
