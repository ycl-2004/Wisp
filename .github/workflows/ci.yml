name: CI

on:
  push:
  pull_request:

jobs:
  test-and-release-check:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project Wisp.xcodeproj
          -scheme Wisp
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: >-
          xcodebuild build
          -project Wisp.xcodeproj
          -scheme Wisp
          -configuration Release
          -arch arm64
          -arch x86_64
          -derivedDataPath "$RUNNER_TEMP/WispDerivedData"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      - name: Verify Release architecture, signature, and entitlements
        run: |
          release_app="$RUNNER_TEMP/WispDerivedData/Build/Products/Release/Wisp.app"
          test -d "$release_app"
          lipo -info "$release_app/Contents/MacOS/Wisp"
          codesign --verify --deep --strict "$release_app"
          codesign -d --entitlements :- "$release_app" > /tmp/wisp-entitlements.plist
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' /tmp/wisp-entitlements.plist 2>/dev/null; then
            echo 'Release unexpectedly contains com.apple.security.get-task-allow' >&2
            exit 1
          fi

  # The app supports macOS 14.0 (project.yml deploymentTarget, Info.plist
  # LSMinimumSystemVersion), but until now nothing ever built or tested for
  # it: an accidental macOS-15-only API use would ship silently and crash
  # 14.0 users at launch. Same steps as the macos-15 job, on the minimum OS.
  test-and-release-check-macos-14:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project Wisp.xcodeproj
          -scheme Wisp
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: >-
          xcodebuild build
          -project Wisp.xcodeproj
          -scheme Wisp
          -configuration Release
          -arch arm64
          -arch x86_64
          -derivedDataPath "$RUNNER_TEMP/WispDerivedData"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      - name: Verify Release architecture, signature, and entitlements
        run: |
          release_app="$RUNNER_TEMP/WispDerivedData/Build/Products/Release/Wisp.app"
          test -d "$release_app"
          lipo -info "$release_app/Contents/MacOS/Wisp"
          codesign --verify --deep --strict "$release_app"
          codesign -d --entitlements :- "$release_app" > /tmp/wisp-entitlements.plist
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' /tmp/wisp-entitlements.plist 2>/dev/null; then
            echo 'Release unexpectedly contains com.apple.security.get-task-allow' >&2
            exit 1
          fi
